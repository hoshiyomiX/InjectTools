name: Bug Report
description: Report a bug to help us improve InjectTools
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees:
  - hoshiyomiX
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I scan a subdomain, the app crashes..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Open the app
        2. Click on 'Batch Scan'
        3. Enter domain 'cloudflare.com'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
      placeholder: "The scan should complete successfully..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: "The app shows an error message..."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
      placeholder: "Drag and drop screenshots here..."

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: What version of InjectTools are you running?
      placeholder: "e.g., v1.2.6"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android Version
      description: What Android version are you running?
      placeholder: "e.g., Android 14"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: What device are you using?
      placeholder: "e.g., Samsung Galaxy S23 Ultra"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logcat Output
      description: If available, paste relevant logcat output here.
      placeholder: "Paste logcat output..."
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have provided all required information
          required: true
        - label: I am willing to help test a fix if needed
          required: false
