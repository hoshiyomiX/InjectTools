name: Feature Request
description: Suggest an idea for InjectTools
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees:
  - hoshiyomiX
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill in the details below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: "I'm always frustrated when I have to manually enter the same domains..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
      placeholder: "Add a 'Recent Domains' dropdown that remembers the last 10 domains used..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or features?
      placeholder: "I considered using clipboard history, but that's not convenient..."

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would improve workflow
        - High - Blocking my use case
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: Mockup / Screenshot
      description: If you have a mockup or screenshot of how this should look, attach it here.
      placeholder: "Drag and drop images here..."

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and feature requests to ensure this is not a duplicate
          required: true
        - label: I have provided a clear problem statement and proposed solution
          required: true
        - label: I am willing to help implement this feature if guidance is provided
          required: false
