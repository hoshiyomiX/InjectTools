name: Build Android APK

on:
  push:
    branches:
      - android-apk-migration
      - main
      - app
    tags:
      - 'v*'
  pull_request:
    branches:
      - app
      - main
  workflow_dispatch:

env:
  # Rust configuration
  RUST_VERSION: stable
  NDK_VERSION: r26d
  
  # Android configuration
  JAVA_VERSION: '17'
  MIN_SDK: '30'
  TARGET_SDK: '34'
  COMPILE_SDK: '34'

jobs:
  build-rust-libs:
    name: Build Rust Libraries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
        include:
          - target: aarch64-linux-android
            arch: arm64-v8a
            api: '30'
            cc_prefix: aarch64-linux-android
          - target: armv7-linux-androideabi
            arch: armeabi-v7a
            api: '30'
            cc_prefix: armv7a-linux-androideabi
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      
      - name: 📦 Restore Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-
      
      - name: 📱 Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          local-cache: true
      
      - name: 🔧 Configure Build Environment
        run: |
          # Export NDK paths
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN_PATH="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64"
          TOOLCHAIN_BIN="${TOOLCHAIN_PATH}/bin"
          
          echo "=== NDK Configuration ==="
          echo "NDK_PATH: ${NDK_PATH}"
          echo "TOOLCHAIN_PATH: ${TOOLCHAIN_PATH}"
          echo "TOOLCHAIN_BIN: ${TOOLCHAIN_BIN}"
          echo ""
          
          # Add to PATH
          echo "${TOOLCHAIN_BIN}" >> $GITHUB_PATH
          
          # Export to GITHUB_ENV for subsequent steps
          echo "NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "TOOLCHAIN=${TOOLCHAIN_PATH}" >> $GITHUB_ENV
          echo "TOOLCHAIN_BIN=${TOOLCHAIN_BIN}" >> $GITHUB_ENV
          
          # Determine correct compiler name
          CC_NAME="${{ matrix.cc_prefix }}${{ matrix.api }}-clang"
          CXX_NAME="${{ matrix.cc_prefix }}${{ matrix.api }}-clang++"
          
          echo "CC_NAME=${CC_NAME}" >> $GITHUB_ENV
          echo "CXX_NAME=${CXX_NAME}" >> $GITHUB_ENV
          
          # Create normalized environment variable names for cc-rs
          TARGET_UPPER=$(echo "${{ matrix.target }}" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
          
          # Set TARGET_CC/AR (cc-rs compatibility)
          echo "TARGET_CC=${TOOLCHAIN_BIN}/${CC_NAME}" >> $GITHUB_ENV
          echo "TARGET_CXX=${TOOLCHAIN_BIN}/${CXX_NAME}" >> $GITHUB_ENV
          echo "TARGET_AR=${TOOLCHAIN_BIN}/llvm-ar" >> $GITHUB_ENV
          
          # Set CC_<target>/AR_<target> (specific target override)
          echo "CC_${TARGET_UPPER}=${TOOLCHAIN_BIN}/${CC_NAME}" >> $GITHUB_ENV
          echo "CXX_${TARGET_UPPER}=${TOOLCHAIN_BIN}/${CXX_NAME}" >> $GITHUB_ENV
          echo "AR_${TARGET_UPPER}=${TOOLCHAIN_BIN}/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_${TARGET_UPPER}=${TOOLCHAIN_BIN}/llvm-ranlib" >> $GITHUB_ENV
          
          # Set generic CC/AR (fallback for ring and other crates)
          echo "CC=${TOOLCHAIN_BIN}/${CC_NAME}" >> $GITHUB_ENV
          echo "CXX=${TOOLCHAIN_BIN}/${CXX_NAME}" >> $GITHUB_ENV
          echo "AR=${TOOLCHAIN_BIN}/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=${TOOLCHAIN_BIN}/llvm-ranlib" >> $GITHUB_ENV
          
          # Set CARGO_TARGET_*_LINKER
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${TOOLCHAIN_BIN}/${CC_NAME}" >> $GITHUB_ENV
          echo "CARGO_TARGET_${TARGET_UPPER}_AR=${TOOLCHAIN_BIN}/llvm-ar" >> $GITHUB_ENV
          
          echo ""
          echo "=== Environment configured ==="
          echo "TARGET_UPPER: ${TARGET_UPPER}"
          echo "CC_NAME: ${CC_NAME}"
      
      - name: 🔗 Create Compiler Symlinks (ring compatibility)
        run: |
          # ring crate sometimes looks for generic arm-linux-androideabi-clang
          # Create symlinks to actual compiler
          
          cd ${TOOLCHAIN_BIN}
          
          # For ARMv7, ring might look for arm-linux-androideabi-clang
          if [[ "${{ matrix.target }}" == "armv7-linux-androideabi" ]]; then
            if [ ! -f "arm-linux-androideabi-clang" ]; then
              echo "Creating symlink: arm-linux-androideabi-clang -> ${CC_NAME}"
              ln -sf "${CC_NAME}" arm-linux-androideabi-clang
              ln -sf "${CXX_NAME}" arm-linux-androideabi-clang++
            fi
          fi
          
          echo "Toolchain bin contents:"
          ls -la | grep -E '(clang|ar)' | head -20
      
      - name: 🔧 Configure Cargo for Android
        run: |
          mkdir -p .cargo
          
          cat > .cargo/config.toml <<'CARGO_END'
          [target.aarch64-linux-android]
          ar = "llvm-ar"
          linker = "aarch64-linux-android30-clang"
          
          [target.armv7-linux-androideabi]
          ar = "llvm-ar"
          linker = "armv7a-linux-androideabi30-clang"
          
          [build]
          target-dir = "target"
          CARGO_END
          
          echo "Generated .cargo/config.toml:"
          cat .cargo/config.toml
      
      - name: 🔍 Verify NDK Setup
        run: |
          echo "=== Verifying NDK Toolchain ==="
          echo "PATH: $PATH"
          echo ""
          
          echo "=== Checking Compiler ==="
          which ${CC_NAME} || echo "❌ ${CC_NAME} not in PATH!"
          ls -la ${TOOLCHAIN_BIN}/${CC_NAME} || echo "❌ ${CC_NAME} not found!"
          
          echo ""
          echo "=== Checking AR ==="
          which llvm-ar || echo "❌ llvm-ar not in PATH!"
          ls -la ${TOOLCHAIN_BIN}/llvm-ar || echo "❌ llvm-ar not found!"
          
          echo ""
          echo "=== Testing Compiler ==="
          ${TOOLCHAIN_BIN}/${CC_NAME} --version || echo "❌ Compiler test failed!"
          
          echo ""
          echo "=== Environment Variables ==="
          env | grep -E '(CC|CXX|AR|RANLIB|NDK|TOOLCHAIN|CARGO_TARGET)' | sort
      
      - name: 🏗️ Build Rust Library
        run: |
          echo "Building for ${{ matrix.target }}..."
          echo ""
          
          # Verify environment one more time
          echo "Build environment:"
          echo "  CC=${CC}"
          echo "  TARGET_CC=${TARGET_CC}"
          echo "  AR=${AR}"
          echo "  CARGO_TARGET linker: $(echo ${{ matrix.target }} | tr '[:lower:]' '[:upper:]' | tr '-' '_')"
          echo ""
          
          # Build with verbose output
          cargo build --release --lib --target ${{ matrix.target }} -vv 2>&1 | tee build.log
          
          # Check if build succeeded
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Build failed!"
            echo ""
            echo "=== Last 50 lines of build log ==="
            tail -50 build.log
            exit 1
          fi
          
          # Verify output
          echo ""
          echo "✅ Build complete. Checking output:"
          ls -lh target/${{ matrix.target }}/release/libinjecttools.so
          file target/${{ matrix.target }}/release/libinjecttools.so
          
          # Check size
          SIZE=$(stat -c%s target/${{ matrix.target }}/release/libinjecttools.so)
          echo "Library size: $SIZE bytes ($(numfmt --to=iec-i --suffix=B $SIZE))"
          if [ $SIZE -lt 100000 ]; then
            echo "❌ Warning: Library suspiciously small (<100KB)!"
            exit 1
          fi
          
          echo "✅ Library build successful!"
      
      - name: 📤 Upload Native Library
        uses: actions/upload-artifact@v4
        with:
          name: libinjecttools-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/libinjecttools.so
          if-no-files-found: error
          retention-days: 7
  
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-rust-libs
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: 📥 Download ARM64 Library
        uses: actions/download-artifact@v4
        with:
          name: libinjecttools-arm64-v8a
          path: android-app/app/src/main/jniLibs/arm64-v8a/
      
      - name: 📥 Download ARMv7 Library
        uses: actions/download-artifact@v4
        with:
          name: libinjecttools-armeabi-v7a
          path: android-app/app/src/main/jniLibs/armeabi-v7a/
      
      - name: 🔍 Verify Native Libraries
        run: |
          echo "ARM64 library:"
          ls -lh android-app/app/src/main/jniLibs/arm64-v8a/
          file android-app/app/src/main/jniLibs/arm64-v8a/libinjecttools.so
          
          echo ""
          echo "ARMv7 library:"
          ls -lh android-app/app/src/main/jniLibs/armeabi-v7a/
          file android-app/app/src/main/jniLibs/armeabi-v7a/libinjecttools.so
      
      - name: 📝 Create local.properties
        run: |
          cat > android-app/local.properties <<LOCAL_PROPS
          sdk.dir=$ANDROID_HOME
          LOCAL_PROPS
      
      - name: 🏗️ Build Debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          
          # Verify output
          echo ""
          ls -lh app/build/outputs/apk/debug/
      
      - name: 📦 Rename APK
        run: |
          VERSION_TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$VERSION_TAG" == refs/heads/* ]]; then
            VERSION_TAG="dev-${GITHUB_SHA:0:7}"
          fi
          
          if [ -f "android-app/app/build/outputs/apk/debug/app-debug.apk" ]; then
            mv android-app/app/build/outputs/apk/debug/app-debug.apk \
               InjectTools-${VERSION_TAG}-debug.apk
          fi
      
      - name: 📊 APK Info
        run: |
          APK_FILE=$(find . -name "InjectTools-*.apk" -type f | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "APK File: $APK_FILE"
            ls -lh "$APK_FILE"
            
            # Show APK details
            echo ""
            echo "Native libraries in APK:"
            unzip -l "$APK_FILE" | grep -E 'lib/.*\.so' || echo "No .so files found!"
            
            echo ""
            echo "Manifest:"
            unzip -l "$APK_FILE" | grep AndroidManifest.xml || true
          fi
      
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InjectTools-APK
          path: InjectTools-*.apk
          if-no-files-found: error
          retention-days: 30
  
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-rust-libs, build-apk]
    if: always()
    
    steps:
      - name: 📊 Generate Summary
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust ARM64 | ${{ needs.build-rust-libs.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust ARMv7 | ${{ needs.build-rust-libs.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android APK | ${{ needs.build-apk.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.build-rust-libs.result }}" == "success" && "${{ needs.build-apk.result }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ All builds completed successfully!" >> $GITHUB_STEP_SUMMARY
            echo "Download APK from Artifacts above." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ Build failed. Check logs above." >> $GITHUB_STEP_SUMMARY
          fi
