name: Build Android APK

on:
  push:
    branches:
      - android-apk-migration
      - main
      - app
    tags:
      - 'v*'
  pull_request:
    branches:
      - app
      - main
  workflow_dispatch:

env:
  # Rust configuration
  RUST_VERSION: stable
  NDK_VERSION: r26d
  
  # Android configuration
  JAVA_VERSION: '17'
  MIN_SDK: '30'
  TARGET_SDK: '34'
  COMPILE_SDK: '34'

jobs:
  build-rust-libs:
    name: Build Rust Libraries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
        include:
          - target: aarch64-linux-android
            arch: arm64-v8a
            api: '30'
          - target: armv7-linux-androideabi
            arch: armeabi-v7a
            api: '30'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      
      - name: 📦 Restore Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-
      
      - name: 📱 Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          local-cache: true
      
      - name: 🔧 Configure Build Environment
        run: |
          # Export NDK paths
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN_PATH="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64"
          
          # Add to PATH
          echo "${TOOLCHAIN_PATH}/bin" >> $GITHUB_PATH
          
          # Export to GITHUB_ENV for subsequent steps
          echo "NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "TOOLCHAIN=${TOOLCHAIN_PATH}" >> $GITHUB_ENV
          
          # Determine correct compiler prefix based on target
          if [[ "${{ matrix.target }}" == "aarch64-linux-android" ]]; then
            CC_PREFIX="aarch64-linux-android"
          elif [[ "${{ matrix.target }}" == "armv7-linux-androideabi" ]]; then
            CC_PREFIX="armv7a-linux-androideabi"  # Note the 'a' after armv7
          fi
          
          # Set environment variables for cc-rs and cargo
          TARGET_UPPER=$(echo "${{ matrix.target }}" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
          
          # Export CC/CXX/AR for the specific target
          echo "CC_${TARGET_UPPER}=${TOOLCHAIN_PATH}/bin/${CC_PREFIX}${{ matrix.api }}-clang" >> $GITHUB_ENV
          echo "CXX_${TARGET_UPPER}=${TOOLCHAIN_PATH}/bin/${CC_PREFIX}${{ matrix.api }}-clang++" >> $GITHUB_ENV
          echo "AR_${TARGET_UPPER}=${TOOLCHAIN_PATH}/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_${TARGET_UPPER}=${TOOLCHAIN_PATH}/bin/llvm-ranlib" >> $GITHUB_ENV
          
          # Also set generic CC/AR (fallback)
          echo "CC=${TOOLCHAIN_PATH}/bin/${CC_PREFIX}${{ matrix.api }}-clang" >> $GITHUB_ENV
          echo "AR=${TOOLCHAIN_PATH}/bin/llvm-ar" >> $GITHUB_ENV
          
          # Set CARGO_TARGET_*_LINKER
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${TOOLCHAIN_PATH}/bin/${CC_PREFIX}${{ matrix.api }}-clang" >> $GITHUB_ENV
          
          echo "Environment configured for ${{ matrix.target }}:"
          echo "CC_PREFIX=${CC_PREFIX}"
          echo "NDK_HOME=${NDK_PATH}"
          echo "TOOLCHAIN=${TOOLCHAIN_PATH}"
      
      - name: 🔧 Configure Cargo for Android
        run: |
          mkdir -p .cargo
          
          TOOLCHAIN_BIN="${TOOLCHAIN}/bin"
          cat > .cargo/config.toml <<CARGO_END
          [target.aarch64-linux-android]
          ar = "${TOOLCHAIN_BIN}/llvm-ar"
          linker = "${TOOLCHAIN_BIN}/aarch64-linux-android${{ matrix.api }}-clang"
          
          [target.armv7-linux-androideabi]
          ar = "${TOOLCHAIN_BIN}/llvm-ar"
          linker = "${TOOLCHAIN_BIN}/armv7a-linux-androideabi${{ matrix.api }}-clang"
          CARGO_END
          
          echo "Generated .cargo/config.toml:"
          cat .cargo/config.toml
      
      - name: 🔍 Verify NDK Setup
        run: |
          echo "=== Verifying NDK Toolchain ==="
          echo "PATH: $PATH"
          echo ""
          
          echo "Checking toolchain directory:"
          ls -la ${TOOLCHAIN}/bin/ | grep -E '(clang|ar)' || true
          echo ""
          
          # Check for aarch64
          if [[ "${{ matrix.target }}" == "aarch64-linux-android" ]]; then
            echo "Checking aarch64-linux-android${{ matrix.api }}-clang:"
            ls -la ${TOOLCHAIN}/bin/aarch64-linux-android${{ matrix.api }}-clang || echo "Not found!"
            which aarch64-linux-android${{ matrix.api }}-clang || echo "Not in PATH!"
          fi
          
          # Check for armv7a (note the 'a')
          if [[ "${{ matrix.target }}" == "armv7-linux-androideabi" ]]; then
            echo "Checking armv7a-linux-androideabi${{ matrix.api }}-clang:"
            ls -la ${TOOLCHAIN}/bin/armv7a-linux-androideabi${{ matrix.api }}-clang || echo "Not found!"
            which armv7a-linux-androideabi${{ matrix.api }}-clang || echo "Not in PATH!"
          fi
          
          echo ""
          echo "Checking llvm-ar:"
          ls -la ${TOOLCHAIN}/bin/llvm-ar || echo "Not found!"
          which llvm-ar || echo "Not in PATH!"
          
          echo ""
          echo "Environment variables:"
          env | grep -E '(CC|AR|NDK|TOOLCHAIN|CARGO_TARGET)' | sort
      
      - name: 🏗️ Build Rust Library
        run: |
          echo "Building for ${{ matrix.target }}..."
          
          # Build with verbose output
          cargo build --release --lib --target ${{ matrix.target }} -vv
          
          # Verify output
          echo ""
          echo "Build complete. Checking output:"
          ls -lh target/${{ matrix.target }}/release/libinjecttools.so
          file target/${{ matrix.target }}/release/libinjecttools.so
          
          # Check size (should be reasonable, not suspiciously small)
          SIZE=$(stat -c%s target/${{ matrix.target }}/release/libinjecttools.so)
          echo "Library size: $SIZE bytes ($(numfmt --to=iec-i --suffix=B $SIZE))"
          if [ $SIZE -lt 100000 ]; then
            echo "❌ Warning: Library suspiciously small (<100KB)!"
            exit 1
          fi
          
          echo "✅ Library build successful!"
      
      - name: 📤 Upload Native Library
        uses: actions/upload-artifact@v4
        with:
          name: libinjecttools-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/libinjecttools.so
          if-no-files-found: error
          retention-days: 7
  
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-rust-libs
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: 📥 Download ARM64 Library
        uses: actions/download-artifact@v4
        with:
          name: libinjecttools-arm64-v8a
          path: android-app/app/src/main/jniLibs/arm64-v8a/
      
      - name: 📥 Download ARMv7 Library
        uses: actions/download-artifact@v4
        with:
          name: libinjecttools-armeabi-v7a
          path: android-app/app/src/main/jniLibs/armeabi-v7a/
      
      - name: 🔍 Verify Native Libraries
        run: |
          echo "ARM64 library:"
          ls -lh android-app/app/src/main/jniLibs/arm64-v8a/
          file android-app/app/src/main/jniLibs/arm64-v8a/libinjecttools.so
          
          echo ""
          echo "ARMv7 library:"
          ls -lh android-app/app/src/main/jniLibs/armeabi-v7a/
          file android-app/app/src/main/jniLibs/armeabi-v7a/libinjecttools.so
      
      - name: 📝 Create local.properties
        run: |
          cat > android-app/local.properties <<LOCAL_PROPS
          sdk.dir=$ANDROID_HOME
          LOCAL_PROPS
      
      - name: 🏗️ Build Debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          
          # Verify output
          echo ""
          ls -lh app/build/outputs/apk/debug/
      
      - name: 📦 Rename APK
        run: |
          VERSION_TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$VERSION_TAG" == refs/heads/* ]]; then
            VERSION_TAG="dev-${GITHUB_SHA:0:7}"
          fi
          
          if [ -f "android-app/app/build/outputs/apk/debug/app-debug.apk" ]; then
            mv android-app/app/build/outputs/apk/debug/app-debug.apk \
               InjectTools-${VERSION_TAG}-debug.apk
          fi
      
      - name: 📊 APK Info
        run: |
          APK_FILE=$(find . -name "InjectTools-*.apk" -type f | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "APK File: $APK_FILE"
            ls -lh "$APK_FILE"
            
            # Show APK details
            echo ""
            echo "Native libraries in APK:"
            unzip -l "$APK_FILE" | grep -E 'lib/.*\.so' || echo "No .so files found!"
            
            echo ""
            echo "Manifest:"
            unzip -l "$APK_FILE" | grep AndroidManifest.xml || true
          fi
      
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InjectTools-APK
          path: InjectTools-*.apk
          if-no-files-found: error
          retention-days: 30
  
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-rust-libs, build-apk]
    if: always()
    
    steps:
      - name: 📊 Generate Summary
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust ARM64 | ${{ needs.build-rust-libs.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust ARMv7 | ${{ needs.build-rust-libs.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android APK | ${{ needs.build-apk.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.build-rust-libs.result }}" == "success" && "${{ needs.build-apk.result }}" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ All builds completed successfully!" >> $GITHUB_STEP_SUMMARY
            echo "Download APK from Artifacts above." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ Build failed. Check logs above." >> $GITHUB_STEP_SUMMARY
          fi
