name: Build Android APK

on:
  push:
    branches:
      - android-apk-migration
      - app
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches:
      - android-apk-migration
      - app
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Rust Library"]
    types:
      - completed

jobs:
  build-apk:
    name: Build InjectTools APK
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Rust libraries
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: rust-library.yml
          name: android-jniLibs-all
          path: android-app/app/src/main/jniLibs/
          workflow_conclusion: success

      - name: Verify jniLibs
        run: |
          echo "Checking jniLibs structure:"
          find android-app/app/src/main/jniLibs/ -name "*.so" -type f
          
          # Verify both architectures exist
          if [ ! -f "android-app/app/src/main/jniLibs/arm64-v8a/libinjecttools.so" ]; then
            echo "Error: ARM64 library not found!"
            exit 1
          fi
          
          if [ ! -f "android-app/app/src/main/jniLibs/armeabi-v7a/libinjecttools.so" ]; then
            echo "Error: ARMv7 library not found!"
            exit 1
          fi
          
          echo "All libraries present ✓"

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: |
          cd android-app
          ./gradlew assembleRelease --stacktrace

      - name: Sign release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/app'
        run: |
          cd android-app
          # TODO: Add signing configuration
          echo "APK signing will be implemented with proper keystore"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: injecttools-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: injecttools-release-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Generate build report
        if: always()
        run: |
          cd android-app
          ./gradlew --version
          
          echo "\n=== APK Build Summary ==="
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android-app/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
