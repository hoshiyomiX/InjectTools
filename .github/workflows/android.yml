name: Android Build

on:
  push:
    branches: [ "apk" ]
  pull_request:
    branches: [ "apk" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        
    - name: Build with Gradle
      shell: bash
      continue-on-error: true
      id: gradle_build
      run: |
        set -o pipefail
        if ! gradle assembleDebug --stacktrace 2>&1 | tee build.log; then
          echo "Build failed. Extracting error log..."
          sed -n '/FAILURE: /,/https:\/\/help.gradle.org/p' build.log > build-error.log
          echo "=== CONTENT OF build-error.log ==="
          cat build-error.log
          exit 1
        fi

    - name: Upload APK
      if: steps.gradle_build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Push Build Error Log
      if: steps.gradle_build.outcome == 'failure'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add build-error.log
        git commit -m "Add build-error.log from failed build"
        git push
        exit 1
