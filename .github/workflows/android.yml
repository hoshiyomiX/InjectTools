name: Android Build

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.11.1'

    # Fix: Use unique name to avoid "Text file busy" conflict with system swap
    - name: Configure Swap Space
      run: |
        sudo fallocate -l 8G /swapfile_build
        sudo chmod 600 /swapfile_build
        sudo mkswap /swapfile_build
        sudo swapon /swapfile_build
        echo "Swap created:"
        free -h
        
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version=8.11.1
        
    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Commit Gradle Wrapper
      # Only run on push to apk branch, not PRs
      if: github.event_name == 'push' && github.ref == 'refs/heads/apk'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add wrapper files
        git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.jar
        
        # Commit if changes exist
        if ! git diff-index --quiet HEAD; then
          echo "Changes detected. Committing wrapper..."
          git commit -m "chore: add gradle wrapper files [skip ci]"
          git push
        else
          echo "No changes to commit"
        fi
        
    - name: Create Keystore
      run: |
        keytool -genkeypair -v \
        -keystore app/release.keystore \
        -keyalg RSA -keysize 2048 -validity 10000 \
        -alias androiddebugkey \
        -dname "CN=Android Debug,O=Android,C=US" \
        -storepass android -keypass android
        
    - name: Build Release APK
      id: build
      # Added --max-workers=2 to further reduce memory pressure
      run: |
        ./gradlew assembleRelease \
          --max-workers=2 \
          --no-daemon \
          -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
          -Pandroid.injected.signing.store.password=android \
          -Pandroid.injected.signing.key.alias=androiddebugkey \
          -Pandroid.injected.signing.key.password=android
      
    - name: List Artifacts
      run: ls -R app/build/outputs/apk/

    - name: Upload Release APKs
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: InjectTools-Release
        path: app/build/outputs/apk/release/*.apk
