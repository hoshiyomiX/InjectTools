name: Android Build

on:
  push:
    branches: [ "apk" ]
  pull_request:
    branches: [ "apk" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        
    - name: Build with Gradle
      id: build
      run: |
        set -o pipefail
        gradle assembleDebug 2>&1 | tee full-build.log
        
    - name: Trap Failure and Extract Log
      if: failure()
      run: |
        echo "Build failed. Extracting error log..."
        # Extract content from "FAILURE:" to the first occurrence of "https://help.gradle.org"
        sed -n '/FAILURE:/,/https:\/\/help.gradle.org/p' full-build.log > build-error.log
        
        # If the file is empty (pattern not found), dump the last 50 lines
        if [ ! -s build-error.log ]; then
          tail -n 50 full-build.log > build-error.log
        fi
        
        cat build-error.log

    - name: Upload Error Log to Repo
      if: failure()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Force add the log file
        git add -f build-error.log
        git commit -m "ci: add build failure log [skip ci]"
        git push

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
