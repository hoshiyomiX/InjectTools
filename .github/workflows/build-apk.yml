name: Build Android APK

on:
  push:
    branches:
      - app
      - main
      - android-apk-migration
      - 'release/**'
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches:
      - app
      - main
    paths:
      - 'android-app/**'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true'
  JAVA_VERSION: '17'
  ANDROID_SDK_VERSION: '34'
  GRADLE_VERSION: '8.5'

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version info
        id: version
        run: |
          cd android-app/app
          VERSION_CODE=$(grep 'versionCode' build.gradle.kts | grep -oP '\d+' | head -1)
          VERSION_NAME=$(grep 'versionName' build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"' | head -1)
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'release' && (github.event.inputs.variant == 'debug' || github.event.inputs.variant == '')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle Wrapper
        run: |
          cd android-app
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ls -la gradlew

      - name: Build Debug APK
        id: build
        run: |
          cd android-app
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build.log
        continue-on-error: true

      - name: Upload build log on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: android-app/build.log
          retention-days: 7

      - name: Display error details
        if: steps.build.outcome == 'failure'
        run: |
          echo "### Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the build-error-log artifact for full details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Last 50 lines of build log:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 android-app/build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Rename APK
        if: steps.build.outcome == 'success'
        run: |
          cd android-app/app/build/outputs/apk/debug
          mv app-debug.apk InjectTools-${{ needs.validate.outputs.version_name }}-debug.apk

      - name: Upload Debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: InjectTools-${{ needs.validate.outputs.version_name }}-debug
          path: android-app/app/build/outputs/apk/debug/InjectTools-*.apk
          retention-days: 30

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'release' || github.event.inputs.variant == 'release'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle Wrapper
        run: |
          cd android-app
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ls -la gradlew

      - name: Build Release APK
        id: build
        run: |
          cd android-app
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --info 2>&1 | tee build.log
        continue-on-error: true

      - name: Upload build log on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: android-app/build.log
          retention-days: 7

      - name: Display error details
        if: steps.build.outcome == 'failure'
        run: |
          echo "### Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the build-error-log artifact for full details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Last 50 lines of build log:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 android-app/build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Rename APK
        if: steps.build.outcome == 'success'
        run: |
          cd android-app/app/build/outputs/apk/release
          APK=$(ls app-release*.apk | head -1)
          mv "$APK" InjectTools-${{ needs.validate.outputs.version_name }}-release.apk

      - name: Upload Release APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: InjectTools-${{ needs.validate.outputs.version_name }}-release
          path: android-app/app/build/outputs/apk/release/InjectTools-*.apk
          retention-days: 90
