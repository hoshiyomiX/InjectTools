name: Build Android APK

on:
  push:
    branches:
      - app
      - main
      - android-apk-migration
      - 'release/**'
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches:
      - app
      - main
    paths:
      - 'android-app/**'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true'
  JAVA_VERSION: '17'
  ANDROID_SDK_VERSION: '34'
  GRADLE_VERSION: '8.5'

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version info
        id: version
        run: |
          cd android-app/app
          VERSION_CODE=$(grep 'versionCode' build.gradle.kts | grep -oP '\d+' | head -1)
          VERSION_NAME=$(grep 'versionName' build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"' | head -1)
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'release' && (github.event.inputs.variant == 'debug' || github.event.inputs.variant == '')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle Wrapper
        run: |
          cd android-app
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew
          ls -la gradlew

      - name: Build Debug APK
        id: build
        run: |
          # Get absolute paths
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          LOG_DIR="$WORKSPACE_DIR/build-logs"
          LOG_FILE="$LOG_DIR/build-debug-$(date +%Y%m%d-%H%M%S).log"
          
          # Create logs directory
          mkdir -p "$LOG_DIR"
          
          echo "Starting debug build..." | tee "$LOG_FILE"
          echo "Timestamp: $(date)" | tee -a "$LOG_FILE"
          echo "Branch: ${GITHUB_REF}" | tee -a "$LOG_FILE"
          echo "Commit: ${GITHUB_SHA}" | tee -a "$LOG_FILE"
          echo "Log file: $LOG_FILE" | tee -a "$LOG_FILE"
          echo "" | tee -a "$LOG_FILE"
          echo "==========================================" | tee -a "$LOG_FILE"
          echo "" | tee -a "$LOG_FILE"
          
          # Build
          cd android-app
          set +e
          ./gradlew assembleDebug --stacktrace --debug 2>&1 | tee -a "$LOG_FILE"
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          echo "" | tee -a "$LOG_FILE"
          echo "==========================================" | tee -a "$LOG_FILE"
          echo "Build finished with exit code: $BUILD_EXIT_CODE" | tee -a "$LOG_FILE"
          
          # Export for next steps
          echo "LOG_FILE=$LOG_FILE" >> $GITHUB_ENV
          echo "LOG_DIR=$LOG_DIR" >> $GITHUB_ENV
          echo "BUILD_EXIT_CODE=$BUILD_EXIT_CODE" >> $GITHUB_ENV
          
          exit $BUILD_EXIT_CODE
        continue-on-error: true

      - name: Extract error details
        if: steps.build.outcome == 'failure'
        run: |
          echo "Extracting compilation errors..."
          
          # Verify log file exists
          if [ ! -f "$LOG_FILE" ]; then
            echo "ERROR: Log file not found: $LOG_FILE"
            exit 0
          fi
          
          # Extract Kotlin compilation errors
          if grep -q "Compilation error" "$LOG_FILE"; then
            echo "KOTLIN_ERROR=true" >> $GITHUB_ENV
            grep -A 20 "Compilation error" "$LOG_FILE" > "$LOG_DIR/kotlin-errors.txt" || true
          fi
          
          # Extract resource linking errors
          if grep -q "Android resource linking failed" "$LOG_FILE"; then
            echo "RESOURCE_ERROR=true" >> $GITHUB_ENV
            grep -A 30 "Android resource linking failed" "$LOG_FILE" > "$LOG_DIR/resource-errors.txt" || true
          fi
          
          # Extract general errors
          grep -E "^e: |ERROR|FAILURE" "$LOG_FILE" > "$LOG_DIR/all-errors.txt" || echo "No explicit errors found" > "$LOG_DIR/all-errors.txt"

      - name: Commit build log to repo
        if: steps.build.outcome == 'failure'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Add all log files
          git add build-logs/
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No log changes to commit"
          else
            # Commit
            git commit -m "ci: Add build failure logs [skip ci]
            
            Build failed at $(date)
            Exit code: $BUILD_EXIT_CODE
            Workflow: $GITHUB_WORKFLOW
            Run: $GITHUB_RUN_NUMBER"
            
            # Push to current branch
            BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            echo "Pushing to branch: $BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME" || echo "Failed to push logs (non-critical)"
          fi

      - name: Display error summary
        if: steps.build.outcome == 'failure'
        run: |
          echo "### 🔴 Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Exit Code:** $BUILD_EXIT_CODE" >> $GITHUB_STEP_SUMMARY
          echo "**Log File:** \`$LOG_FILE\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$KOTLIN_ERROR" = "true" ] && [ -f "$LOG_DIR/kotlin-errors.txt" ]; then
            echo "#### Kotlin Compilation Errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -100 "$LOG_DIR/kotlin-errors.txt" >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "$RESOURCE_ERROR" = "true" ] && [ -f "$LOG_DIR/resource-errors.txt" ]; then
            echo "#### Resource Linking Errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -100 "$LOG_DIR/resource-errors.txt" >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "#### Last 200 Lines of Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 "$LOG_FILE" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full log committed to \`build-logs/\` directory" >> $GITHUB_STEP_SUMMARY
          
          exit 1

      - name: Rename APK
        if: steps.build.outcome == 'success'
        run: |
          cd android-app/app/build/outputs/apk/debug
          mv app-debug.apk InjectTools-${{ needs.validate.outputs.version_name }}-debug.apk

      - name: Upload Debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: InjectTools-${{ needs.validate.outputs.version_name }}-debug
          path: android-app/app/build/outputs/apk/debug/InjectTools-*.apk
          retention-days: 30

      - name: Success summary
        if: steps.build.outcome == 'success'
        run: |
          echo "### ✅ Build Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.validate.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** InjectTools-${{ needs.validate.outputs.version_name }}-debug.apk" >> $GITHUB_STEP_SUMMARY

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'release' || github.event.inputs.variant == 'release'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle Wrapper
        run: |
          cd android-app
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x gradlew

      - name: Build Release APK
        id: build
        run: |
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          LOG_DIR="$WORKSPACE_DIR/build-logs"
          LOG_FILE="$LOG_DIR/build-release-$(date +%Y%m%d-%H%M%S).log"
          
          mkdir -p "$LOG_DIR"
          
          cd android-app
          set +e
          ./gradlew assembleRelease --stacktrace --debug 2>&1 | tee "$LOG_FILE"
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          echo "LOG_FILE=$LOG_FILE" >> $GITHUB_ENV
          echo "LOG_DIR=$LOG_DIR" >> $GITHUB_ENV
          echo "BUILD_EXIT_CODE=$BUILD_EXIT_CODE" >> $GITHUB_ENV
          
          exit $BUILD_EXIT_CODE
        continue-on-error: true

      - name: Commit build log to repo
        if: steps.build.outcome == 'failure'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add build-logs/
          
          if ! git diff --cached --quiet; then
            git commit -m "ci: Add release build failure logs [skip ci]" || true
            BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            git push origin "HEAD:$BRANCH_NAME" || true
          fi

      - name: Display error summary
        if: steps.build.outcome == 'failure'
        run: |
          echo "### 🔴 Release Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 "$LOG_FILE" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Rename APK
        if: steps.build.outcome == 'success'
        run: |
          cd android-app/app/build/outputs/apk/release
          APK=$(ls app-release*.apk | head -1)
          mv "$APK" InjectTools-${{ needs.validate.outputs.version_name }}-release.apk

      - name: Upload Release APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: InjectTools-${{ needs.validate.outputs.version_name }}-release
          path: android-app/app/build/outputs/apk/release/InjectTools-*.apk
          retention-days: 90
