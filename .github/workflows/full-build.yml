name: Full Build Pipeline

# Combined workflow for building Rust library + Android APK
# This runs the complete pipeline in sequence

on:
  push:
    branches:
      - app
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Stage 1: Build Rust libraries
  build-rust:
    name: Build Rust Libraries (ARM64 + ARMv7)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Configure for Android
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android30-clang"
          ar = "llvm-ar"
          [target.armv7-linux-androideabi]
          linker = "armv7a-linux-androideabi30-clang"
          ar = "llvm-ar"
          EOF
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build
        run: cargo build --release --lib --target ${{ matrix.target }}

      - name: Package
        run: |
          ABI=$([ "${{ matrix.target }}" = "aarch64-linux-android" ] && echo "arm64-v8a" || echo "armeabi-v7a")
          mkdir -p jniLibs/$ABI
          cp target/${{ matrix.target }}/release/libinjecttools.so jniLibs/$ABI/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.target }}
          path: jniLibs/

  # Stage 2: Build Android APK
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-rust
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download ARM64 lib
        uses: actions/download-artifact@v4
        with:
          name: lib-aarch64-linux-android
          path: android-app/app/src/main/jniLibs/

      - name: Download ARMv7 lib
        uses: actions/download-artifact@v4
        with:
          name: lib-armv7-linux-androideabi
          path: android-app/app/src/main/jniLibs/

      - name: Verify libs
        run: find android-app/app/src/main/jniLibs/ -name "*.so"

      - name: Grant execute permission
        run: chmod +x android-app/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build APK
        run: |
          cd android-app
          ./gradlew assembleRelease --stacktrace

      - name: Sign APK (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # TODO: Implement signing with secrets
          echo "Signing will be added with keystore secrets"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InjectTools-APK
          path: android-app/app/build/outputs/apk/release/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android-app/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 3: Report
  report:
    name: Build Report
    runs-on: ubuntu-latest
    needs: build-apk
    if: always()
    
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: InjectTools-APK
          path: apk/

      - name: Generate Report
        run: |
          echo "# Build Report" > report.md
          echo "" >> report.md
          echo "**Workflow:** ${{ github.workflow }}" >> report.md
          echo "**Branch:** ${{ github.ref_name }}" >> report.md
          echo "**Commit:** ${{ github.sha }}" >> report.md
          echo "**Build Time:** $(date -u)" >> report.md
          echo "" >> report.md
          echo "## APK Files" >> report.md
          ls -lh apk/*.apk >> report.md
          cat report.md

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.md
