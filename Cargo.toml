[package]
name = "injecttools"
version = "4.0.0-alpha"
edition = "2021"
authors = ["hoshiyomi_id <t.me/hoshiyomi_id>"]
description = "Bug Inject Scanner for Cloudflare Subdomains - Android APK & Termux"
license = "MIT"
repository = "https://github.com/hoshiyomiX/InjectTools"
keywords = ["android", "termux", "cloudflare", "scanner", "networking"]
categories = ["command-line-utilities", "network-programming"]

# ═════════════════════════════════════════════════════════════════
# BUILD TARGETS
# ═════════════════════════════════════════════════════════════════

# Binary target (for Termux CLI)
[[bin]]
name = "injecttools"
path = "src/main.rs"

# Library target (for Android APK via JNI)
[lib]
name = "injecttools"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# ═════════════════════════════════════════════════════════════════
# HTTP CLIENT - Native Rust (NO CURL DEPENDENCY)
# ═════════════════════════════════════════════════════════════════

# Hyper for HTTP/HTTPS - replaces curl for Android compatibility
hyper = { version = "1.1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"

# Reqwest - Keep for crt.sh API (lighter than hyper for simple requests)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Rustls - Pin to compatible version for Android
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# ═════════════════════════════════════════════════════════════════
# ASYNC RUNTIME
# ═════════════════════════════════════════════════════════════════

tokio = { version = "1", features = ["full"] }
futures = "0.3"

# ═════════════════════════════════════════════════════════════════
# DNS RESOLUTION - Use hickory-resolver (formerly trust-dns)
# ═════════════════════════════════════════════════════════════════

# hickory-resolver is the new name for trust-dns-resolver
# More Android-friendly and actively maintained
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "dns-over-rustls"] }

# ═════════════════════════════════════════════════════════════════
# ANDROID JNI BINDINGS
# ═════════════════════════════════════════════════════════════════

jni = "0.21"
lazy_static = "1.4"

# ═════════════════════════════════════════════════════════════════
# CLI & TUI (Termux only)
# ═════════════════════════════════════════════════════════════════

clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
dialouer = "0.11"
terminal_size = "0.3"

# ═════════════════════════════════════════════════════════════════
# NETWORKING
# ═════════════════════════════════════════════════════════════════

ipnetwork = "0.20"

# ═════════════════════════════════════════════════════════════════
# SERIALIZATION
# ═════════════════════════════════════════════════════════════════

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# ═════════════════════════════════════════════════════════════════
# DATE/TIME
# ═════════════════════════════════════════════════════════════════

chrono = "0.4"

# ═════════════════════════════════════════════════════════════════
# ERROR HANDLING
# ═════════════════════════════════════════════════════════════════

anyhow = "1.0"
thiserror = "1.0"

# ═════════════════════════════════════════════════════════════════
# SIGNAL HANDLING (Termux only)
# ═════════════════════════════════════════════════════════════════

ctrlc = "3.4"

# ═════════════════════════════════════════════════════════════════
# UTILITIES
# ═════════════════════════════════════════════════════════════════

regex = "1.10"

# ═════════════════════════════════════════════════════════════════
# ANDROID-SPECIFIC PATCHES
# ═════════════════════════════════════════════════════════════════

[target.'cfg(target_os = "android")'.dependencies]
# Force compatible ring version for Android
ring = { version = "0.17", default-features = false, features = ["alloc", "std"] }

[profile.release]
opt-level = "z"       # Optimize for size
lto = true            # Link-time optimization
codegen-units = 1     # Single codegen unit
strip = true          # Strip symbols
panic = "abort"       # Abort on panic

# ═════════════════════════════════════════════════════════════════
# PATCH SECTION - Force exact versions for Android compatibility
# ═════════════════════════════════════════════════════════════════

[patch.crates-io]
# Force exact ring version to avoid ambiguity
# Using =0.17.8 ensures all dependencies use the same version
ring = { version = "=0.17.8" }