# Project-wide Gradle settings.

# JVM args for Gradle daemon.
# CI runners are memory constrained; keep heap moderate to avoid OOM.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Disable parallel to reduce peak memory usage (more stable on CI)
org.gradle.parallel=false

# AndroidX Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Cache
org.gradle.caching=true

# Disable daemon to ensure fresh memory on each CI run
org.gradle.daemon=false

# Keep R8 full mode off (clarity)
android.enableR8.fullMode=false
