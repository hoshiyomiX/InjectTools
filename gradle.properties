# Project-wide Gradle settings.

# JVM args for Gradle daemon.
# Optimized for Kotlin 2.0 + AGP 8.7.3 + R8
org.gradle.jvmargs=-Xmx6144m -XX:+UseParallelGC -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Disable parallel to reduce peak memory usage (more stable on CI)
org.gradle.parallel=false

# AndroidX Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Cache
org.gradle.caching=true

# Disable daemon to ensure fresh memory on each CI run
org.gradle.daemon=false

# Keep R8 full mode off (clarity)
android.enableR8.fullMode=false

# Kotlin 2.0 optimizations
kotlin.stdlib.default.dependency=false
kotlin.daemon.jvmargs=-Xmx2048m
