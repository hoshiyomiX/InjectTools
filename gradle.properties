# Project-wide Gradle settings.

# JVM args for Gradle daemon.
# Increased to 6GB because R8 (Minification) requires significant heap.
# We have configured 8GB swap in CI, so this is safe and necessary to prevent GC overhead limit errors.
org.gradle.jvmargs=-Xmx6144m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Disable parallel to reduce peak memory usage (more stable on CI)
org.gradle.parallel=false

# AndroidX Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Cache
org.gradle.caching=true

# Disable daemon to ensure fresh memory on each CI run
org.gradle.daemon=false

# Keep R8 full mode off (clarity)
android.enableR8.fullMode=false
