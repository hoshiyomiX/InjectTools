# Project-wide Gradle settings.

# === JVM Configuration ===
# Optimized for GitHub Actions runners (7GB+ available)
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# === Build Performance ===
# Enable parallel execution (faster on multi-core)
org.gradle.parallel=true

# Enable build caching (incremental builds)
org.gradle.caching=true

# Enable configuration caching (significant speedup)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# === Android Settings ===
android.useAndroidX=true
android.nonTransitiveRClass=true

# === Kotlin Settings ===
kotlin.code.style=official

# === CI-Specific (overridden in workflow) ===
# Daemon disabled in CI via GRADLE_OPTS for fresh builds
# Local dev can use daemon for faster iterative builds
org.gradle.daemon=true
